services:
  postgres:
    image: postgres:16-alpine
    container_name: maxim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxim
      POSTGRES_USER: maxim_admin
      POSTGRES_PASSWORD: maxim_password_dev
    ports:
      - "5432:5432"
    volumes:
      - maxim_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxim_admin -d maxim"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  maxim_pgdata:
    driver: local
